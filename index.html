<script type="module">
    import { SuperType, TagArgument } from "./index.js";

    const tw = new SuperType(document.body, {
        "end": function() {
            const returnButton = document.createElement("div");
            returnButton.classList.add("button");
            returnButton.id = "return";
            returnButton.textContent = "▌< Return";
            returnButton.onclick = () => {
                location.href = 'https://rus1130.github.io/space2313/';
            };
            tw.appendToTarget(returnButton);
            tw.target.style.overflowY = 'scroll';
            tw.target.classList.add('hide-scrollbar');
        },

        "jitterlerp": function(engine, token){
            const [name, text, leftValue, rightValue] = token.args;

            text.check("string")
            leftValue.check("number")
            rightValue.check("number")

            const tokens = [];

            for(let i = 0; i < text.value.length; i++){
                const character = text.value[i];

                // interpolate
                const strength = leftValue.value + (rightValue.value - leftValue.value) * (i / (text.value.length - 1));

                tokens.push({
                    type: "tag",
                    name: "jitter",
                    style: token.style,
                    args: [
                        new TagArgument("string", character),
                        new TagArgument("number", strength),
                    ]
                })
            }

            engine.insertTokens(tokens);
        },

        "hardinstant": function(engine, token) {
            tw.state.userInstantOverride = !tw.state.userInstantOverride;
        },

        "sine": function(engine, token) {
            const cssStyle = document.createElement("style");
            cssStyle.textContent = `
                @keyframes typewriter-sine {
                    from {
                        transform: translateY(var(--sine-amplitude));
                    }

                    50% {
                        transform: translateY(calc(var(--sine-amplitude) * -1));
                    }

                    to {
                        transform: translateY(var(--sine-amplitude));
                    }
                }

                .typewriter-sine {
                    display: inline-block;
                    animation-name: typewriter-sine;
                    animation-timing-function: linear;
                    animation-iteration-count: infinite;
                }
            `;

            document.body.appendChild(cssStyle);


            const [name, lastCharacters, frequency, amplitude] = token.args;

            lastCharacters.check("number");
            frequency.check("number");
            amplitude.check("number");

            const count = lastCharacters.value;
            const duration = 1 / frequency.value;

            function applySine(element, index) {
                element.style.setProperty(
                    "--sine-amplitude",
                    `${amplitude.value}px`
                );

                element.style.animationDuration = `${duration}s`;

                element.style.animationDelay =
                    `${-duration * (index / count)}s`;

                element.classList.add("typewriter-sine");
            }

            function update() {
                const elements = Array.from(engine.target.children)
                    .slice(-count);

                elements.forEach((element, index) => {
                    applySine(element, index);
                });
            }

            update();

            if (!engine.sineObservers) {
                engine.sineObservers = {};
            }

            const observer = new MutationObserver(() => {
                update();
            });

            observer.observe(engine.target, {
                childList: true
            });

            engine.sineObservers[name] = observer;
        }
    })

    await tw.load("example.st").then(() => {
        tw.allowControls("all");
        tw.start();
    })
</script>
