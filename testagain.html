    import { SuperType, TagArgument, SuperTypeError } from './index.js';
 
    async function scanPixels(imgSrc, width, height) {
        const bitmap = []

        const img = new Image();
        img.src = imgSrc;
        await img.decode();
 
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
 
        canvas.width = width;
        canvas.height = height;
 
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(img, 0, 0, width, height);
 
        // Grab the entire pixel buffer ONCE
        const data = ctx.getImageData(0, 0, width, height).data;
 
        // Loop through pixels
        for (let y = 0; y < height; y++) {
 
            let row = []
 
            for (let x = 0; x < width; x++) {
 
                const i = (y * width + x) * 4;
 
                let r = data[i];
                let g = data[i + 1];
                let b = data[i + 2];
                let a = data[i + 3];
 
                let hex = (r << 16) | (g << 8) | b;
 
                // push it into the bitmap
 
                row.push(hex.toString(16).padStart(6, "0"))
            }
 
            bitmap.push(row.join(" "))
        }

        return bitmap.map(row => row.split(" "));
    }
