<head>
    <canvas id="c"></canvas>
    <canvas id="c2"></canvas>
</head>

<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script type="module">
    const bitmap = []
 
    class ImageReader {
 
        constructor(type, array2D) {
            if (!Array.isArray(array2D) || array2D.some(r => !Array.isArray(r))) {
                throw new Error("Invalid image data (0)");
            }
 
            if (array2D.length === 0 || array2D[0].length === 0) {
                throw new Error("Invalid image data (1)");
            }
 
            this.type = type;
            this.height = array2D.length;
            this.width = array2D[0].length;
 
            // IMPORTANT: store raw reference, but never mutate it
            this.bitmap = array2D;
 
            const colorFrequency = {};
            for (let row of array2D) {
                for (let color of row) {
                    colorFrequency[color] = (colorFrequency[color] || 0) + 1;
                }
            }
 
            this.palette = Object.entries(colorFrequency)
                .sort((a, b) => b[1] - a[1])
                .map(x => x[0]);
        }
 
        // =========================
        toFile(stringify = false) {
            let fileContent;
 
            if (this.type === "bmap") {
                fileContent = [
                    "bmap",
                    this.bitmap.map(row => row.join(" "))
                ];
            }
 
            return stringify ? JSON.stringify(fileContent) : fileContent;
        }
 
        // =========================
        reconstruct() {
            const canvas = document.getElementById("c2");
            const ctx = canvas.getContext("2d");
 
            const fileData = this.toFile();
 
            canvas.width = this.width;
            canvas.height = this.height;
 
            ctx.imageSmoothingEnabled = false;
 
            if (this.type === "bmap") {
                const imgData = fileData[1];
 
                for (let y = 0; y < imgData.length; y++) {
                    const row = imgData[y].split(" ");
 
                    for (let x = 0; x < row.length; x++) {
                        const hex = row[x];
 
                        const r = parseInt(hex.slice(0, 2), 16);
                        const g = parseInt(hex.slice(2, 4), 16);
                        const b = parseInt(hex.slice(4, 6), 16);
 
                        ctx.fillStyle = `rgb(${r},${g},${b})`;
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
            }
        }
 
    }
 
    async function scanPixels(imgSrc, width, height) {
        const img = new Image();
        img.src = imgSrc;
        await img.decode();
 
        const canvas = document.getElementById("c");
        const ctx = canvas.getContext("2d");
 
        canvas.width = width;
        canvas.height = height;
 
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(img, 0, 0, width, height);
 
        // Grab the entire pixel buffer ONCE
        const data = ctx.getImageData(0, 0, width, height).data;
 
        // Loop through pixels
        for (let y = 0; y < height; y++) {
 
            let row = []
 
            for (let x = 0; x < width; x++) {
 
                const i = (y * width + x) * 4;
 
                let r = data[i];
                let g = data[i + 1];
                let b = data[i + 2];
                let a = data[i + 3];
 
                let hex = (r << 16) | (g << 8) | b;
 
                // push it into the bitmap
 
                row.push(hex.toString(16).padStart(6, "0"))
            }
 
            bitmap.push(row.join(" "))
        }
    }
 
    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            console.log("Copied to clipboard");
        }).catch(err => {
            console.error("Could not copy text: ", err);
        });
    }
    

    // width of the actual image
    const width = 312;
    // height of the actual image
    const height = 438;
 
    scanPixels("test-img-NOT-MINE.png", width, height).then(() => {
        let bitmapCompat = bitmap.map(row => row.split(" "));
 
        const bmap = new ImageReader("st", bitmapCompat);
 
        const array = bmap.bitmap;
 
        const mixin = "{{# first is text, 2nd is background #}}\n[mixin \"c\"]\n    [color <Color:1>][bg <Color:2>]▀\n[mixin end]"
        let output = new String(mixin) + "\n\n[$instant][textsize 1]\n"; 
 
        for(let i = 0; i < array.length; i += 2) {
            const textColorRow = array[i];
            const bgColorRow = array[i + 1];
 
            for(let j = 0; j < textColorRow.length; j++) {
                const textColor = textColorRow[j];
                const bgColor = bgColorRow[j];
 
 
                output += `[@use "c" #${textColor} #${bgColor}]`
            }
            output += "[newline]\n"
        }
 
        output += "[$instant off][textsize default][resetcolors]"
 
        copyToClipboard(output);
 
        bmap.reconstruct();
    })
</script>
